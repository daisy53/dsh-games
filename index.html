<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的小游戏</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background: radial-gradient(1200px 600px at 50% -10%, #24304a 0%, #0d1117 55%, #080a0f 100%); color:#e6edf3;
         display:flex; flex-direction:column; align-items:center; padding:48px 20px 64px; }
  h1 { font-size: clamp(26px, 5vw, 40px); margin:0 0 8px; letter-spacing:.02em; }
  p.sub { color:#8b98a9; margin:0 0 40px; font-size:15px; }
  .grid { display:grid; gap:20px; width:100%; max-width:720px;
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  a.card { display:flex; flex-direction:column; gap:10px; padding:22px; border-radius:16px; text-decoration:none;
           background: linear-gradient(160deg, #1b2333, #121722); border:1px solid #242d3d; color:#e6edf3;
           transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; }
  a.card:hover { transform: translateY(-3px); border-color:#3b82f6; box-shadow:0 12px 30px rgba(59,130,246,.25); }
  .tag { font-size:12px; color:#7dd3fc; letter-spacing:.08em; text-transform:uppercase; }
  .title { font-size:20px; font-weight:600; }
  .desc { font-size:13px; color:#8b98a9; line-height:1.5; }
  footer { margin-top:48px; font-size:12px; color:#4b5563; }
</style>
</head>
<body>
  <h1>我的小游戏</h1>
  <p class="sub">点开就能玩，手机电脑都行</p>
  <div class="grid">
    <a class="card" href="./chaowan-xxl/">
      <span class="tag">3D · 休闲</span>
      <span class="title">潮玩消消乐</span>
      <span class="desc">60 秒收集潮玩，躲开捣乱的家伙</span>
    </a>
  </div>
  <footer>Powered by DSH Game Studio</footer>
</body>
</html>
